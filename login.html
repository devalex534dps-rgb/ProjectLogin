<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema | Login</title>
  <!-- Bootstrap 5 CSS CDN para mantener consistencia -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="bg-light d-flex align-items-center py-4" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow border-0 rounded-4 p-4">

          <!-- Pestañas para alternar entre Iniciar Sesión y Registrarse -->
          <ul class="nav nav-pills nav-justified mb-4" id="pagoTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="tab"
                data-bs-target="#login-content" type="button" role="tab">Iniciar Sesión</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-content"
                type="button" role="tab">Registrarse</button>
            </li>
          </ul>

          <div class="tab-content" id="myTabContent">

            <!-- FORMULARIO DE LOGIN -->
            <div class="tab-pane fade show active" id="login-content" role="tabpanel">
              <h3 class="text-center fw-bold mb-3">Iniciar Sesión</h3>
              <form id="formLogin">
                <div class="mb-3">
                  <label for="loginEmail" class="form-label">Correo Electrónico</label>
                  <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                  <label for="loginPassword" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar al Sistema</button>
              </form>
            </div>

            <!-- FORMULARIO DE REGISTRO LOCAL -->
            <div class="tab-pane fade" id="register-content" role="tabpanel">
              <h3 class="text-center fw-bold mb-3">Crear Cuenta</h3>
              <form id="formRegister">
                <div class="mb-3">
                  <label for="regUsername" class="form-label">Nombre de Usuario</label>
                  <input type="text" class="form-control" id="regUsername" required placeholder="Nombre o usuario">
                </div>
                <div class="mb-3">
                  <label for="regEmail" class="form-label">Correo Electrónico</label>
                  <input type="email" class="form-control" id="regEmail" required>
                </div>
                <div class="mb-3">
                  <label for="regAge" class="form-label">Edad</label>
                  <input type="number" class="form-control" id="regAge" min="1" max="120" required placeholder="Ej. 20">
                </div>
                <div class="mb-3">
                  <label for="regPassword" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="regPassword" required>
                </div>
                <div id="regAlert" class="alert alert-success d-none" role="alert"></div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Registrar Usuario</button>
              </form>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Llibrería de utilerías y lógica de validación -->
  <script src="libreria/utileria.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
