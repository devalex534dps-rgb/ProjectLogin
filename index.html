<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="brand-title">Menú</span>
            <button class="icon-btn" id="toggleSidebar" aria-label="Alternar menú">
                <svg class="toggle-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <rect class="line-1" x="4" y="5" width="16" height="2.5" rx="1.25" />
                    <rect class="line-2" x="4" y="10.75" width="16" height="2.5" rx="1.25" />
                    <rect class="line-3" x="4" y="16.5" width="16" height="2.5" rx="1.25" />
                </svg>
            </button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item-group">
                <div class="nav-item" id="usersMenuBtn">
                    <span>Usuarios</span>
                    <span class="chevron">▼</span>
                </div>
                <div class="submenu" id="usersSubmenu">
                    <a href="#" class="nav-item active" id="captureMenuOption">
                        <span>Captura</span>
                    </a>
                </div>
            </div>
        </nav>
    </aside>



    <!-- WRAPPER PRINCIPAL -->
    <div class="main-wrapper">
        <header class="navbar">
            <div class="user-profile">
                <span class="user-name" id="navbarUserName">name_usuario</span>
            </div>


            <div class="dropdown-container">
                <button class="icon-btn" id="toggleNavbarMenu" aria-label="Opciones de usuario">
                    <svg class="toggle-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <rect class="line-1" x="4" y="5" width="16" height="2.5" rx="1.25" />
                        <rect class="line-2" x="4" y="10.75" width="16" height="2.5" rx="1.25" />
                        <rect class="line-3" x="4" y="16.5" width="16" height="2.5" rx="1.25" />
                    </svg>
                </button>

                <div class="dropdown-menu" id="userDropdown">
                    <button class="dropdown-item" id="btnLogout">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <main class="content-container">
            <div class="status-badge" id="statusBadge">
                Verificando datos...
            </div>

            <div class="card-form">
                <div class="form-group">
                    <label for="control-number" class="form-label">Número de Control</label>
                    <input type="text" id="control-number" class="form-input" placeholder="Ej. 18260100"
                        autocomplete="off">
                </div>
                <button type="button" class="btn-primary" id="validateBtn">Validar</button>
            </div>
        </main>
    </div>

    <!--Modal de Evaluacion de Edad-->
    <div class="modal-overlay" id="ageModal">
        <div class="modal-card">
            <button class="modal-close-btn" id="closeAgeModalBtn" arai-label="Cerrar Modal">
                <svg class="close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 class="modal-title">Estado del usuario</h2>
            <div id="ageModalContent"
                style="text-align: center; font-size: 1.1rem; font-weight: 600; margin-top: 15px;">

            </div>
        </div>
    </div>

    <!-- MODAL FORMULARIO DE CAPTURA CON FONDO BLUR -->
    <div class="modal-overlay" id="captureModal">
        <div class="modal-card">
            <!-- Botón X animado en la esquina superior izquierda -->
            <button class="modal-close-btn" id="closeModalBtn" aria-label="Cerrar modal">
                <svg class="close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <h2 class="modal-title">Captura de Usuario</h2>

            <form class="modal-form" id="captureForm" onsubmit="event.preventDefault();">
                <div class="modal-field">
                    <label for="modal-username">Nombre de Usuario</label>
                    <input type="text" id="modal-username" placeholder="Ingresa usuario" required autocomplete="off">
                </div>

                <div class="modal-field">
                    <label for="modal-email">Correo Electrónico</label>
                    <input type="email" id="modal-email" placeholder="correo@ejemplo.com" required autocomplete="off">
                </div>

                <div class="modal-field">
                    <label for="modal-age">Edad</label>
                    <input type="number" id="modal-age" placeholder="Ej. 21" min="1" max="120" required>
                </div>

                <div class="modal-field">
                    <label for="modal-password">Contraseña</label>
                    <input type="password" id="modal-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="modal-submit-btn">Guardar Registro</button>
            </form>
        </div>
    </div>
    <script src="js/main.js"></script>

</body>
<script src="libreria/utileria.js"></script>
<script>
    if (captureForm) {
        captureForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('modal-username').value.trim();
            const correo = document.getElementById('modal-email').value.trim();
            const edad = parseInt(document.getElementById('modal-age').value, 10);
            const password = document.getElementById('modal-password').value.trim();

            if (isNaN(edad) || edad <= 0) {
                alert("Por favor ingresa una edad válida.");
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('usuariosSistema')) || [];
            if (usuarios.some(u => u.email.toLowerCase() === correo.toLowerCase())) {
                alert("Este correo ya se encuentra registrado.");
                return;
            }

            const nuevoUsuario = {
                nombre: nombre,
                email: correo,
                edad: edad,
                password: password,
                numControl: ''
            };

            usuarios.push(nuevoUsuario);
            localStorage.setItem('usuariosSistema', JSON.stringify(usuarios));

            alert("¡Usuario capturado con éxito!");
            captureModal.classList.remove('active');
            captureForm.reset();
        });
    }
</script>

</html>
